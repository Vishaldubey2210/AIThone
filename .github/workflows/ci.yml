name: BitHead Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Core Algorithm Tests
        run: node tests/crypto-calc.test.js

      - name: Validate HTML Structure
        run: |
          test -f index.html
          test -f styles.css
          test -f script.js
          test -f manifest.json
